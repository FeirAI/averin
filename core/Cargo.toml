[package]
name = "feir-decision-core"
version = "0.1.0"
description = "feir integrity core: canonicalize -> commit -> hash -> sign -> DAG-link -> checkpoint -> verify. Single source of truth (lib + verify CLI + WASM)."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "feir_decision_core"
# rlib: bin + tests; cdylib/staticlib: cgo FFI + wasm
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "feir-verify"
path = "src/bin/feir_verify.rs"

[features]
default = ["std"]
std = ["dep:getrandom"]
# Real RFC 3161 DER/CMS TimeStampToken verification (used by the Go anchoring job + CLI).
# Off by default so the WASM verifier bundle stays lean (test-anchor needs none of this).
rfc3161 = ["dep:cms", "dep:x509-cert", "dep:der", "dep:spki", "dep:const-oid", "dep:p256", "dep:ecdsa", "dep:signature"]
# Exposes the in-Rust mini-TSA token builder (rfc3161::make_test_token) for fixtures/tests.
test-tsa = ["rfc3161"]

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
unicode-normalization = "0.1"
getrandom = { version = "0.2", optional = true }
# rfc3161 feature only. The `builder` features of cms/x509-cert are deliberately NOT enabled: they drag
# in `rsa` (-> getrandom) and a cert-signing stack we never use — the verifier only PARSES tokens, and the
# hermetic make_test_token assembles its CMS SignedData by hand from the core types (no cms::builder).
cms = { version = "0.2", optional = true }
x509-cert = { version = "0.2", optional = true }
der = { version = "0.7", optional = true, features = ["derive", "oid"] }
spki = { version = "0.7", optional = true }
const-oid = { version = "0.9", optional = true, features = ["db"] }
p256 = { version = "0.13", optional = true, features = ["ecdsa", "pkcs8"] }
ecdsa = { version = "0.16", optional = true, features = ["der"] }
signature = { version = "2", optional = true }

[dev-dependencies]
ed25519-dalek = "2"
