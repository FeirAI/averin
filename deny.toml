# cargo-deny supply-chain policy for the Rust integrity core (the trust root). Enforced in CI.
# Run locally: cargo deny check

[graph]
# Check the tree the shipped verifier and server are built with, not only the default features: the
# `rfc3161` feature (real TSA token verification) brings in the RSA verifier.
features = ["rfc3161"]

[advisories]
version = 2
# A YANKED crate in Cargo.lock is a supply-chain smell (pulled for a reason) — fail on it.
# Known vulnerabilities are always denied under schema v2 and cannot be downgraded here.
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "Marvin timing attack on RSA private-key operations (decrypt, sign). averin uses the rsa crate only to VERIFY RSA timestamp-authority signatures with a public key (core/src/rfc3161.rs verify_rsa); no private key is ever loaded, so there is nothing to recover. Tests that sign with RSA run in dev builds only. Revisit if a patched rsa ships or the verify path changes." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 timing variability in operations meant to be constant-time. It is reached only through elliptic-curve 0.13 from ecdsa 0.16 / p256 0.13 / p384 0.13, under the optional rfc3161 feature, and shipped code uses them only to VERIFY RFC 3161 timestamp-authority signatures (core/src/rfc3161.rs verify_ecdsa_p256, verify_ecdsa_p384): the TSA public key, the signature and the signed message are all public, so timing reveals nothing secret. P-256/P-384 signing exists only under cfg(test) or the test-tsa feature (CI tests). No 0.13-line release depends on a fixed crypto-bigint (>= 0.7.6). Lead decision 2026-10-26: migrate to the RustCrypto 0.14 line after release 1 and remove this entry; revisit by 2027-01-31 at the latest, or at once if the verify path changes." },
]

[licenses]
version = 2
# The core's transitive tree is entirely permissive (see `cargo metadata` license set). Anything OUTSIDE
# this allow-list fails — a copyleft/unknown license entering the trust root must be a deliberate decision,
# not a silent dependency bump.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-1-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
# Surface (don't hard-fail) duplicate versions and wildcard requirements: both are reproducibility/bloat
# smells in a trust root, worth a CI warning without blocking a legitimate transitive diamond.
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only crates.io. An unknown registry or a git dependency in the trust root is denied — no out-of-band code.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
