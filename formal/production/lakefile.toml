name = "AverinProduction"
version = "0.1.0"
defaultTargets = ["Extracted", "Refinement"]

# Aeneas Lean backend at the commit pinned in formal/production/PINS; run-production-refinement.sh
# places it at .aeneas (a symlink to a verified local copy, or a fresh checkout of the pinned commit).
# Its own manifest pins mathlib and the rest of the Lean dependencies (see lake-manifest.json).
[[require]]
name = "aeneas"
path = ".aeneas/backends/lean"

# The unchanged Averin model (formal/lean), compiled here with this project's Lean so its theorems and
# the extracted production code live in one environment. Its own 4.30 build is untouched.
[[lean_lib]]
name = "Averin"
srcDir = "../lean"

# Generated by Aeneas from core/src (Types.lean, Funs.lean) plus the audited external glue.
[[lean_lib]]
name = "Extracted"
globs = ["Extracted.+"]

# Refinement proofs: generated production functions against the Averin model.
[[lean_lib]]
name = "Refinement"

# The axiom/escape-hatch audit (pure Lean; run by scripts/Audit.lean over the loaded package).
[[lean_lib]]
name = "ProductionAudit"
