\* Retention < MaxTTL: a pruned-but-live key is re-consumed and the resource acts twice
\* (expected: AtMostOncePerKey VIOLATED -- the replay the README describes).
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 2
  MaxTTL = 3
  Retention = 1
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = FALSE
  UnsafeMigration = FALSE
SPECIFICATION Spec
INVARIANTS AtMostOncePerKey
CHECK_DEADLOCK FALSE
