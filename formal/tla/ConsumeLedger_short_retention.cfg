\* Retention < MaxTTL: a pruned-but-live key is replayable (expected to FAIL AtMostOncePerKey).
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 2
  MaxTTL = 3
  Retention = 1
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = FALSE
  UnsafeMigration = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK AtMostOncePerKey InFlightRecorded
CHECK_DEADLOCK FALSE
