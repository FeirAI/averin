\* Reachability witness for GrantLog_fair_retry.cfg: same constants and specification, but asserts the state
\* W_Gap describes is NEVER reached. run-tlc.sh requires this to be VIOLATED.
CONSTANTS
  Grants = {g1, g2, g3}
  ReleaseOnError = TRUE
  ReleaseCanFail = TRUE
  FailClosedCheckpoint = TRUE
  ReleaseOnlyIfMax = TRUE
  ReleaseOnlyFresh = TRUE
  UniqueIndex = TRUE
  AgeFromLastAttempt = TRUE
  VoidEnabled = FALSE
  MaxCheckpoints = 2
SPECIFICATION SpecFairRetry
INVARIANTS W_Gap
CHECK_DEADLOCK FALSE
