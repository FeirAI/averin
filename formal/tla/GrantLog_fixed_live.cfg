\* Operator void; clients may give up anywhere, a grant retried forever eventually commits (expected: CheckpointRecovers holds) [2 grants: liveness over 3 grants is too slow for CI]
CONSTANTS
  Grants = {g1, g2}
  ReleaseOnError = TRUE
  ReleaseCanFail = TRUE
  FailClosedCheckpoint = TRUE
  ReleaseOnlyIfMax = TRUE
  ReleaseOnlyFresh = TRUE
  UniqueIndex = TRUE
  AgeFromLastAttempt = TRUE
  VoidEnabled = TRUE
  MaxCheckpoints = 2
SPECIFICATION SpecFairVoid
INVARIANTS BoundNotBinding
PROPERTIES CheckpointRecovers
CHECK_DEADLOCK FALSE
