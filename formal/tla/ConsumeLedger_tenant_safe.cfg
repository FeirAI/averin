\* No legacy exclusion at the start (an old writer may still act once before the cutover), the
\* 2026-10-08 fix of a vacuous configuration: with LegacyPresent = TRUE no consume is reachable
\* inside the capability lifetime, so TenantIsolation held trivially. Here consume is reachable;
\* the _witness_ configurations of this file fail the gate if that stops being true.
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 1
  MaxTTL = 2
  Retention = 2
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = FALSE
  UnsafeMigration = FALSE
SPECIFICATION TenantSpec
INVARIANTS TenantTypeOK TenantAtMostOnce TenantIsolation
CHECK_DEADLOCK FALSE
