\* VACUOUS (2026-10-07 review): TenantConsume is never enabled in any reachable state of this
\* configuration, and TenantIsolation's antecedent is exactly TenantCanConsume(P2), so the passing
\* result checks nothing. Kept only because run-tlc.sh pins every configuration's outcome.
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 1
  MaxTTL = 2
  Retention = 2
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = TRUE
  UnsafeMigration = FALSE
SPECIFICATION TenantSpec
INVARIANTS TenantTypeOK TenantAtMostOnce TenantIsolation
CHECK_DEADLOCK FALSE
