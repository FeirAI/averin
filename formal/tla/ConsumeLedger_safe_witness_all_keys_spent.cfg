\* Reachability witness for ConsumeLedger_safe.cfg: same constants and specification, but asserts the state
\* W_AllKeysSpent describes is NEVER reached. run-tlc.sh requires this to be VIOLATED.
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 2
  MaxTTL = 2
  Retention = 2
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = FALSE
  UnsafeMigration = FALSE
SPECIFICATION Spec
INVARIANTS W_AllKeysSpent
CHECK_DEADLOCK FALSE
