\* Reachability witness for ConsumeLedger_tenant_safe.cfg: same constants and specification, but asserts the state
\* W_IsolationAntecedent describes is NEVER reached. run-tlc.sh requires this to be VIOLATED.
CONSTANTS
  Instances = {i1, i2}
  UseLimit = 1
  MaxTTL = 2
  Retention = 2
  MaxTime = 5
  Projects = {p1, p2}
  P1 = p1
  P2 = p2
  LegacyPresent = FALSE
  UnsafeMigration = FALSE
SPECIFICATION TenantSpec
INVARIANTS W_IsolationAntecedent
CHECK_DEADLOCK FALSE
