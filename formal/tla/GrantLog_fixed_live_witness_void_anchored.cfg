\* Reachability witness for GrantLog_fixed_live.cfg: same constants and specification, but asserts the state
\* W_VoidAnchored describes is NEVER reached. run-tlc.sh requires this to be VIOLATED.
CONSTANTS
  Grants = {g1, g2}
  ReleaseOnError = TRUE
  ReleaseCanFail = TRUE
  FailClosedCheckpoint = TRUE
  ReleaseOnlyIfMax = TRUE
  ReleaseOnlyFresh = TRUE
  UniqueIndex = TRUE
  AgeFromLastAttempt = TRUE
  VoidEnabled = TRUE
  MaxCheckpoints = 2
SPECIFICATION SpecFairVoid
INVARIANTS W_VoidAnchored
CHECK_DEADLOCK FALSE
