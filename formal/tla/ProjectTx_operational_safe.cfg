\* A use that takes the project guard, reads the authoritative revocation state and acts while
\* still holding the guard (GuardedUseBegin/End). ProjectTx_operational_unserialized.cfg is the same
\* model with the guard off and must find the revoke-between-read-and-act race.
\* NoGhostFinalize is NOT checked here: with Authoritative = TRUE it holds by definition (Finalize
\* reads the authoritative pending flag in the same step), so it is no evidence. NoRevokedUse is
\* also true by definition for the older single-step Use action; the guarded use is what it checks.
CONSTANTS Replicas = {r1, r2}
          Serialize = TRUE
          Authoritative = TRUE
SPECIFICATION OperationalSpec
INVARIANTS NoRevokedUse
CHECK_DEADLOCK FALSE
