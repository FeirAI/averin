\* HOLDS BY DEFINITION (2026-10-07 review): with Authoritative = TRUE the actions never set
\* badUse or badFinalize, so NoRevokedUse and NoGhostFinalize hold whatever the project guard
\* does (the run also passes with Serialize = FALSE). Not evidence for any implementation claim.
CONSTANTS Replicas = {r1, r2}
          Serialize = TRUE
          Authoritative = TRUE
SPECIFICATION OperationalSpec
INVARIANTS NoRevokedUse NoGhostFinalize
CHECK_DEADLOCK FALSE
