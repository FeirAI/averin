name: ci

# The Rust version is pinned in rust-toolchain.toml (1.92.0 + wasm32/i686 targets + rustfmt/clippy). cargo
# honors that file in every job below regardless of which toolchain the setup action installs, so the
# reproducible verifier .wasm digest and the CI build share one source of truth. Bump it there, not here.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core:
    name: rust decision-core (golden vectors + adversarial fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (golden vectors are the acceptance gate)
        run: cargo test
      - name: test rfc3161 + mini-TSA (real RFC 3161 token verify)
        run: cargo test --features test-tsa
      - name: build verify CLI
        run: cargo build --release --bin feir-verify
      - name: build verify CLI WITH rfc3161 (shippable real-TSA verifier stays green)
        run: cargo build --release --bin feir-verify --features rfc3161

  core-32bit:
    name: rust decision-core on 32-bit (usize=u32 — wasm32 truncation gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      # i686 has usize == u32, exactly like the shipped wasm32 verifier. Running the FULL adversarial suite
      # here makes the 32-bit-truncation regression tests load-bearing in CI — chiefly the cosig
      # `tier_b_cosig_threshold_above_u32_is_not_truncated` and the bounded_reuse use_limit cases, where an
      # `i64 as usize` would deflate a signed threshold/limit and fail OPEN on a 32-bit verdict but pass on
      # 64-bit. wasm32-unknown-unknown can't run std `#[test]` without wasm-bindgen (which the core avoids),
      # so i686 is the practical native stand-in for the same usize width.
      - name: install 32-bit linker (multilib)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: test on i686 (32-bit usize)
        run: cargo test --target i686-unknown-linux-gnu

  server:
    name: go server (cgo -> rust core; ingestion + verify pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build rust staticlib (cgo links it)
        run: cargo build -p feir-decision-core
      - name: stale-staticlib guard (the cgo lib must match current core source, never a stale trust root)
        run: ./scripts/check-staticlib-fresh.sh
      - name: go vet + test
        working-directory: server
        run: |
          go vet ./...
          go test ./...
      - name: govulncheck (Go stdlib + module CVE scan; cgo needs the staticlib built above)
        working-directory: server
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  store-postgres:
    name: store parity + append-only (Mem semantics ↔ real Postgres, non-owner role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the test step runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # The store package is pure Go (no cgo/core dependency), so no rust staticlib build is needed.
      # Setting FEIR_TEST_DATABASE_URL un-skips the Postgres tests: the SAME exercise*(t, Store) contract
      # helpers that TestMem* run now also run against real Postgres (parity), and
      # TestPostgresAppendOnlyRejectsMutation proves UPDATE/DELETE/TRUNCATE are rejected (SQLSTATE 42501)
      # under a freshly-created non-owner least-privilege role — the deployment topology the append-only
      # claim depends on, exercised end to end. The superuser `postgres` role can CREATE ROLE for that test.
      - name: store tests against real Postgres (parity + non-owner append-only)
        working-directory: server
        env:
          FEIR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: go test -count=1 ./internal/store/... ./internal/pgledger/...

  web:
    name: web app (svelte build + trace unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  sdk:
    name: typescript sdk (test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  verifier:
    name: "offline verifier (trust-root tests: NUL-truncation, supply-chain pin, accountability)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      # build.sh builds the wasm + self-pins index.html/sidecar to THIS build (wasm32 bytes are host-specific,
      # so the committed dev-host pin is re-derived here rather than asserted — see verifier/SUPPLY-CHAIN.md).
      - name: build wasm + self-pin
        run: ./verifier/build.sh
      - name: verifier tests
        working-directory: verifier
        run: bun test

  wasm:
    name: wasm build (verifier skew gate — same core, byte-for-byte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: build wasm (same C ABI as cgo; no wasm-bindgen, RNG-free)
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features

  supply-chain:
    name: "supply chain (cargo-deny: advisories, licenses, sources, bans)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans Cargo.lock for known-vulnerable/yanked crates, non-permissive licenses, and any dependency
      # not from crates.io — a defense for the Rust integrity core (the trust root). Policy: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans
