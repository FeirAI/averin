name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core:
    name: rust decision-core (golden vectors + adversarial fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (golden vectors are the acceptance gate)
        run: cargo test
      - name: test rfc3161 + mini-TSA (real RFC 3161 token verify)
        run: cargo test --features test-tsa
      - name: build verify CLI
        run: cargo build --release --bin feir-verify

  server:
    name: go server (cgo -> rust core; ingestion + verify pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: build rust staticlib (cgo links it)
        run: cargo build -p feir-decision-core
      - name: go vet + test
        working-directory: server
        run: |
          go vet ./...
          go test ./...

  wasm:
    name: wasm build (verifier skew gate — same core, byte-for-byte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: build wasm (same C ABI as cgo; no wasm-bindgen, RNG-free)
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features
