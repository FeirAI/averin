name: ci

# The Rust version is pinned in rust-toolchain.toml (1.92.0 + wasm32/i686 targets + rustfmt/clippy). cargo
# honors that file in every job below regardless of which toolchain the setup action installs, so the
# reproducible verifier .wasm digest and the CI build share one source of truth. Bump it there, not here.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  core:
    name: rust decision-core (golden vectors + adversarial fixtures)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (golden vectors are the acceptance gate)
        run: cargo test
      - name: test rfc3161 + mini-TSA (real RFC 3161 token verify)
        run: cargo test --features test-tsa
      - name: build verify CLI
        run: cargo build --release --bin averin-verify
      - name: build verify CLI WITH rfc3161 (shippable real-TSA verifier stays green)
        run: cargo build --release --bin averin-verify --features rfc3161

  core-32bit:
    name: rust decision-core on 32-bit (usize=u32 — wasm32 truncation gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      # Distinct prefix so this job never shares a cache key with the host-target `core` job
      # (Swatinem also hashes targets; prefix is belt-and-suspenders for the cross-compile case).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: core-32bit
      # i686 has usize == u32, exactly like the shipped wasm32 verifier. Running the FULL adversarial suite
      # here makes the 32-bit-truncation regression tests load-bearing in CI — chiefly the cosig
      # `tier_b_cosig_threshold_above_u32_is_not_truncated` and the bounded_reuse use_limit cases, where an
      # `i64 as usize` would deflate a signed threshold/limit and fail OPEN on a 32-bit verdict but pass on
      # 64-bit. wasm32-unknown-unknown can't run std `#[test]` without wasm-bindgen (which the core avoids),
      # so i686 is the practical native stand-in for the same usize width.
      - name: install 32-bit linker (multilib)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: test on i686 (32-bit usize)
        run: cargo test --target i686-unknown-linux-gnu

  server:
    name: go server (cgo -> rust core; ingestion + verify pipeline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: build rust staticlib (cgo links it)
        run: cargo build -p averin-decision-core
      - name: stale-staticlib guard (the cgo lib must match current core source, never a stale trust root)
        run: ./scripts/check-staticlib-fresh.sh
      - name: go vet + test
        working-directory: server
        run: |
          go vet ./...
          go test ./...
      - name: govulncheck (Go stdlib + module CVE scan; cgo needs the staticlib built above)
        working-directory: server
        run: |
          # Pinned deliberately (was @latest — the only unpinned tool install across the five repos).
          # Bump on a schedule when reviewing supply-chain CI; do not float back to @latest.
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  store-postgres:
    name: store parity + append-only + pgdurable (Mem semantics ↔ real Postgres, non-owner role)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before the test step runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      # The store package is pure Go (no cgo/core dependency), so no rust staticlib build is needed.
      # Setting AVERIN_TEST_DATABASE_URL un-skips the Postgres tests: the SAME exercise*(t, Store) contract
      # helpers that TestMem* run now also run against real Postgres (parity), and
      # TestPostgresAppendOnlyRejectsMutation proves UPDATE/DELETE/TRUNCATE are rejected (SQLSTATE 42501)
      # under a freshly-created non-owner least-privilege role — the deployment topology the append-only
      # claim depends on, exercised end to end. The superuser `postgres` role can CREATE ROLE for that test.
      # pgdurable is INCLUDED here too: it is the durable-revocation + two-phase-grant store whose own doc
      # calls a lost revoke "a fail-open — the verifier would then accept a grant an operator believed was
      # blocked", and TestPutPendingConflictReturnsWinningRow arbitrates multi-replica pending-grant races.
      # Its Postgres tests self-skip without a DSN, so the SAME CI-style DSN (no '?') that broke its harness's
      # search_path concatenation now exercises the robust separator fix — see pgdurable_test.go.
      - name: store + pgdurable tests against real Postgres (parity + non-owner append-only + durable revocation)
        working-directory: server
        env:
          AVERIN_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: go test -count=1 ./internal/store/... ./internal/pgledger/... ./internal/pgdurable/...

  web:
    name: web app (svelte build + trace unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  sdk:
    name: typescript sdk (test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  verifier:
    name: "offline verifier (trust-root tests: NUL-truncation, supply-chain pin, accountability)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
      # build.sh builds the wasm + self-pins index.html/sidecar to THIS build (wasm32 bytes are host-specific,
      # so the committed dev-host pin is re-derived here rather than asserted — see verifier/SUPPLY-CHAIN.md).
      - name: build wasm + self-pin
        run: ./verifier/build.sh
      - name: verifier tests
        working-directory: verifier
        run: bun test

  wasm:
    name: wasm build (verifier skew gate — same core, byte-for-byte)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build wasm (same C ABI as cgo; no wasm-bindgen, RNG-free)
        run: cargo build --release --target wasm32-unknown-unknown --lib --no-default-features

  supply-chain:
    name: "supply chain (cargo-deny: advisories, licenses, sources, bans)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # Scans Cargo.lock for known-vulnerable/yanked crates, non-permissive licenses, and any dependency
      # not from crates.io — a defense for the Rust integrity core (the trust root). Policy: deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources bans

  formal-lean:
    name: formal — Lean seal/canon/DAG/chain proofs (no sorry, standard axioms only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: true
          build-args: --wfail
          test: false
          lint: false
          use-mathlib-cache: false
      - name: headline theorems depend only on propext / Classical.choice / Quot.sound
        working-directory: formal/lean
        run: bash ./check-axioms.sh

  formal-refinement:
    name: formal — Rust ↔ Lean refinement gate (executable Lean oracle + tag inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal/lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
      - name: tag inventory (every Rust domain tag is a Lean family, and vice versa)
        run: python3 formal/check-refinement.py
      - name: build the executable Lean oracle
        working-directory: formal/lean
        run: lake build --wfail oracle
      - name: regenerate expected.json from the model; the committed file must be its exact output
        working-directory: formal/lean
        run: |
          lake exe oracle ../oracle/inputs.json ../oracle/expected.json
          git diff --exit-code -- ../oracle/expected.json
      - name: Rust produces the model's bytes (canon, escapes, framing, every preimage family)
        run: cargo test -p averin-decision-core --test oracle

  formal-kani:
    name: formal — Kani bounded proofs over the real encoders/parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install only; formal/run-kani.sh drives the named harnesses (bare `cargo-kani` would try every
      # harness with default features).
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          args: --version
      - run: bash formal/run-kani.sh

  formal-tla:
    name: formal — TLA+ grant-log and consume-ledger models (expected outcomes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: bash formal/tla/run-tlc.sh
