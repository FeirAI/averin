name: formal-probe

# Diagnostic runs of single Kani harnesses on the hosted x86_64 runner. Informational only: a probe
# never backs a claim and is never a required check.
on:
  push:
    branches: [ formal/ci-green-honest ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.harness }} opt=${{ matrix.opt }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        harness: [utf16_key_order_is_exact_steered, utf16_key_order_is_transitive, utf16_strict_matches_std, utf16_key_order_is_exact_1_1]
        opt: ['3', '0']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: add swap so a CBMC memory peak cannot kill the hosted runner
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /mnt/cbmc.swap
          sudo chmod 600 /mnt/cbmc.swap
          sudo mkswap /mnt/cbmc.swap
          sudo swapon /mnt/cbmc.swap
          free -h
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: 0.68.0
          command: cargo-kani
          args: --version
      - name: run the harness
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: ${{ matrix.opt }}
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/probe"
          /usr/bin/time -v -o "$RUNNER_TEMP/probe/time.txt" timeout 2400 \
            bash formal/run-kani.sh --harness "${{ matrix.harness }}" > "$RUNNER_TEMP/probe/kani.log" 2>&1
          code=$?
          echo "exit=$code"
          grep -E "Stub:|Runtime Symex|size of program|remaining after|Runtime Convert SSA|Runtime Solver|variables, |VERIFICATION:|Verification Time" "$RUNNER_TEMP/probe/kani.log" | grep -v '^Check ' | tail -40
          grep -cE "function alloc::raw_vec::RawVecInner::grow_one" "$RUNNER_TEMP/probe/kani.log" | sed 's/^/grow_one path aborts: /'
          grep -E "Maximum resident|Elapsed" "$RUNNER_TEMP/probe/time.txt"
          exit $code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-${{ matrix.harness }}-opt${{ matrix.opt }}
          path: ${{ runner.temp }}/probe/
          retention-days: 30
