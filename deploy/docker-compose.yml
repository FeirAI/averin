# averin — full self-host stack. From the repo root:
#
#   AVERIN_SIGNING_SEED=$(openssl rand -hex 32) AVERIN_PROXY_INBOUND_TOKEN=$(openssl rand -hex 24) \
#     docker compose -f deploy/docker-compose.yml up --build
#
# Then: web app at http://localhost:8088, offline verifier at /verifier/, ingestion API at :8080,
# OpenAI-compatible proxy at :8081 (point your agent's base_url there). All three ports bind to
# 127.0.0.1 only — put averin behind your own authenticated reverse proxy to expose it off-host.
name: averin

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: averin
      POSTGRES_PASSWORD: ${AVERIN_DB_PASSWORD:-averin}
      POSTGRES_DB: averin
    volumes:
      - averin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U averin -d averin"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No published port by default — reachable only on the compose network. Uncomment to inspect:
    # ports: ["5432:5432"]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["averin-server"]
    # averin-server drains in-flight requests for up to AVERIN_SHUTDOWN_TIMEOUT (default 25s) on SIGTERM;
    # the compose stop grace must EXCEED that or the drain is SIGKILLed (Docker's default is 10s).
    stop_grace_period: 30s
    environment:
      # REQUIRED — no default. Generate a fresh 32-byte seed; production backs signing with a KMS/CSI.
      AVERIN_SIGNING_SEED: ${AVERIN_SIGNING_SEED:?set a real 32-byte signing seed, e.g. export AVERIN_SIGNING_SEED=$(openssl rand -hex 32)}
      AVERIN_SIGNING_KEY_ID: k0
      AVERIN_ADDR: ":8080"
      # Durable append-only store. The server auto-applies the (idempotent) schema on startup. NOTE:
      # it connects as the table-owning role here, so the append-only REVOKE is a no-op (owner bypass)
      # — fine for self-host; DB-enforced append-only needs a separate least-privilege role.
      AVERIN_DATABASE_URL: postgres://averin:${AVERIN_DB_PASSWORD:-averin}@db:5432/averin?sslmode=disable
    # loopback only — the app API is unauthenticated by Phase-1 design (docs/coverage-limits.md);
    # expose via your own authenticated reverse proxy.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["averin-proxy"]
    # The proxy streams completions; it drains in-flight streams for up to AVERIN_SHUTDOWN_TIMEOUT
    # (default 60s) on SIGTERM, so the stop grace must exceed that.
    stop_grace_period: 65s
    environment:
      AVERIN_UPSTREAM: ${AVERIN_UPSTREAM:-https://api.openai.com}
      AVERIN_SERVER_URL: http://server:8080
      AVERIN_PROJECT_ID: ${AVERIN_PROJECT_ID:-default}
      AVERIN_PROXY_ADDR: ":8081"
      # REQUIRED — no default. Without this the proxy is an OPEN RELAY + evidence-injection surface
      # (see averin-proxy's own startup WARN). Callers present it as X-Averin-Proxy-Token / Bearer.
      AVERIN_PROXY_INBOUND_TOKEN: ${AVERIN_PROXY_INBOUND_TOKEN:?set an inbound token, e.g. export AVERIN_PROXY_INBOUND_TOKEN=$(openssl rand -hex 24); callers send it as X-Averin-Proxy-Token / Bearer}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - server

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - server

volumes:
  averin-pgdata:
