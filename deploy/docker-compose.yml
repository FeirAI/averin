# feir — full self-host stack. From the repo root:
#
#   FEIR_SIGNING_SEED=$(openssl rand -hex 32) docker compose -f deploy/docker-compose.yml up --build
#
# Then: web app at http://localhost:8088, offline verifier at /verifier/, ingestion API at :8080,
# OpenAI-compatible proxy at :8081 (point your agent's base_url there).
name: feir

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feir
      POSTGRES_PASSWORD: ${FEIR_DB_PASSWORD:-feir}
      POSTGRES_DB: feir
    volumes:
      - feir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feir -d feir"]
      interval: 3s
      timeout: 3s
      retries: 20
    # No published port by default — reachable only on the compose network. Uncomment to inspect:
    # ports: ["5432:5432"]

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["feir-server"]
    # feir-server drains in-flight requests for up to FEIR_SHUTDOWN_TIMEOUT (default 25s) on SIGTERM;
    # the compose stop grace must EXCEED that or the drain is SIGKILLed (Docker's default is 10s).
    stop_grace_period: 30s
    environment:
      # DEV DEFAULT — override with a real secret. Production backs signing with a KMS, not a seed.
      FEIR_SIGNING_SEED: ${FEIR_SIGNING_SEED:-000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f}
      FEIR_SIGNING_KEY_ID: k0
      FEIR_ADDR: ":8080"
      # Durable append-only store. The server auto-applies the (idempotent) schema on startup. NOTE:
      # it connects as the table-owning role here, so the append-only REVOKE is a no-op (owner bypass)
      # — fine for self-host; DB-enforced append-only needs a separate least-privilege role.
      FEIR_DATABASE_URL: postgres://feir:${FEIR_DB_PASSWORD:-feir}@db:5432/feir?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["feir-proxy"]
    # The proxy streams completions; it drains in-flight streams for up to FEIR_SHUTDOWN_TIMEOUT
    # (default 60s) on SIGTERM, so the stop grace must exceed that.
    stop_grace_period: 65s
    environment:
      FEIR_UPSTREAM: ${FEIR_UPSTREAM:-https://api.openai.com}
      FEIR_SERVER_URL: http://server:8080
      FEIR_PROJECT_ID: ${FEIR_PROJECT_ID:-default}
      FEIR_PROXY_ADDR: ":8081"
    ports:
      - "8081:8081"
    depends_on:
      - server

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "8088:80"
    depends_on:
      - server

volumes:
  feir-pgdata:
