server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # wasm must be served with the right type so WebAssembly.instantiateStreaming works
  types { application/wasm wasm; }

  # standalone offline verifier (vanilla + wasm)
  location /verifier/ { try_files $uri $uri/ /verifier/index.html; }

  # proxy app-API calls to the averin server
  location /v2/ { proxy_pass http://server:8080; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
