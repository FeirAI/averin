server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # wasm must be served with the right type so WebAssembly.instantiateStreaming works
  types { application/wasm wasm; }

  # Security headers (defense-in-depth). This app renders agent-authored evidence
  # (event_type, action, observed_via, session/project ids) sourced from potentially
  # adversarial agent runs, so a restrictive CSP is the standard second line of defense
  # even though the Svelte build only uses auto-escaping text interpolation today.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # standalone offline verifier (vanilla + wasm). This page intentionally ships as a single
  # static file with an inline <script type="module"> (readable/auditable by design — see its
  # own copy) and an inline <style> block, and compiles WebAssembly from a same-origin fetch
  # (see verifier/averin.js). Its CSP has to allow that inline code and wasm compilation, so it
  # is scoped to this location only and does not loosen the policy above for the rest of the app.
  # add_header does not inherit across a location that redefines it, so the shared headers are
  # repeated here.
  location /verifier/ {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    try_files $uri $uri/ /verifier/index.html;
  }

  # proxy app-API calls to the averin server
  location /v2/ { proxy_pass http://server:8080; }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }
}
