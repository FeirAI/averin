[workspace]
resolver = "2"
members = ["core"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/averin-dev/averin"
rust-version = "1.85"

# Small, self-contained release artifacts (lean WASM verifier bundle + static FFI lib).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
